    <script>
      (function () {
        try {
          var own = Object.getOwnPropertyDescriptor(window, 'fetch');
          var target = window;
          var desc = own;
          while (!desc && target) {
            target = Object.getPrototypeOf(target);
            if (target) desc = Object.getOwnPropertyDescriptor(target, 'fetch');
          }
          if (desc && desc.get && !desc.set && (!own || own.configurable)) {
            var customFetch = null;
            var nativeGetter = desc.get;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable !== false,
              get: function () {
                return customFetch || nativeGetter.call(window);
              },
              set: function (fn) {
                if (typeof fn === 'function') customFetch = fn;
              }
            });
          }
        } catch (e) {}

        window.addEventListener(
          'error',
          function (event) {
            if (
              event &&
              typeof event.filename === 'string' &&
              event.filename.indexOf('chrome-extension://') === 0 &&
              typeof event.message === 'string' &&
              event.message.indexOf('Cannot set property fetch') !== -1
            ) {
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
